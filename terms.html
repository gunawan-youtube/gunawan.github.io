    <style>
        :root {
            --bg-dark: #0f0f12;
            --card-bg: #1a1a20;
            --accent: #00d2ff;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Merriweather', serif;
            line-height: 1.6;
        }

        /* --- HEADER --- */
        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
            position: sticky; top: 0; z-index: 1000;
        }
        .container {
            max-width: 1100px; margin: 0 auto; padding: 0 20px;
        }
        .nav-flex {
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand {
            font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; font-weight: 700; color: white; text-decoration: none; letter-spacing: 2px;
        }
        .nav-links a {
            color: var(--text-muted); text-decoration: none; margin-left: 20px; font-family: 'Rajdhani', sans-serif; font-weight: 700; text-transform: uppercase; font-size: 0.9rem;
        }
        .nav-links a:hover { color: var(--accent); }

        /* --- CONTENT PAGE --- */
        .content-page {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 8px;
            margin: 40px auto 60px auto;
            max-width: 800px; /* Lebar konten khusus halaman */
        }
        .content-page h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }
        .content-page h2 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.8rem;
            color: white;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        .content-page h3 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.3rem;
            color: var(--accent);
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .content-page p {
            margin-bottom: 15px;
            color: var(--text-main);
        }
        .content-page ul {
            list-style: disc;
            margin-left: 25px;
            margin-bottom: 15px;
            color: var(--text-main);
        }
        .content-page ol {
            list-style: decimal;
            margin-left: 25px;
            margin-bottom: 15px;
            color: var(--text-main);
        }
        .content-page li {
            margin-bottom: 8px;
        }
        .content-page a {
            color: var(--accent);
            text-decoration: none;
        }
        .content-page a:hover {
            text-decoration: underline;
        }

        /* --- FOOTER --- */
        footer {
            background: #000; padding: 40px 0; text-align: center; border-top: 1px solid #222;
        }
        .footer-nav a { color: #666; margin: 0 10px; text-decoration: none; font-size: 0.9rem; }
        .footer-nav a:hover { color: white; }

        /* --- RESPONSIVE --- */
        @media(max-width: 768px) {
            .nav-links { display: none; } /* Bisa diganti hamburger menu kalau mau kompleks */
            .content-page { padding: 20px; margin: 20px auto 40px auto; }
            .content-page h1 { font-size: 2rem; }
            .content-page h2 { font-size: 1.5rem; }
            .content-page h3 { font-size: 1.1rem; }
        }
    </style>
</head>
