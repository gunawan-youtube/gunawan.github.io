<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hubungi GUPI24 untuk kerjasama, pertanyaan, atau saran.">
    <meta name="robots" content="index, follow">
    
    <!-- ADSENSE -->
    <meta name="google-adsense-account" content="ca-pub-6265573430839351">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6265573430839351" crossorigin="anonymous"></script>

    <title>Contact Us - GUPI24</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root { --bg-dark: #0f0f12; --card-bg: #1a1a20; --accent: #00d2ff; --text-main: #e0e0e0; --text-muted: #a0a0a0; --border: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Merriweather', serif; line-height: 1.6; }
        
        header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 1rem 0; position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 800px; margin: 0 auto; padding: 0 20px; } /* Lebih sempit untuk form */
        .nav-flex { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto; } /* Nav tetap lebar */
        
        .brand { font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; font-weight: 700; color: white; text-decoration: none; letter-spacing: 2px; }
        .nav-links a { color: var(--text-muted); text-decoration: none; margin-left: 20px; font-family: 'Rajdhani', sans-serif; font-weight: 700; text-transform: uppercase; font-size: 0.9rem; }
        .nav-links a:hover { color: var(--accent); }

        .page-content { background: var(--card-bg); border: 1px solid var(--border); padding: 40px; border-radius: 8px; margin: 40px auto; }
        h1 { font-family: 'Rajdhani', sans-serif; font-size: 2.5rem; margin-bottom: 10px; color: white; }
        
        /* FORM STYLES */
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-family: 'Rajdhani', sans-serif; font-weight: 700; color: var(--accent); }
        input, textarea { width: 100%; padding: 12px; background: #0f0f12; border: 1px solid var(--border); color: white; border-radius: 4px; font-family: 'Merriweather', serif; }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); }
        
        button.submit-btn {
            background: var(--accent); color: var(--bg-dark); border: none; padding: 12px 30px; 
            font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1rem; 
            cursor: pointer; border-radius: 4px; width: 100%; transition: 0.3s;
        }
        button.submit-btn:hover { background: white; }

        footer { background: #000; padding: 40px 0; text-align: center; border-top: 1px solid #222; margin-top: auto; }
        .footer-nav a { color: #666; margin: 0 10px; text-decoration: none; font-size: 0.9rem; }
        .footer-nav a:hover { color: white; }
    </style>
</head>
<body>

    <header>
        <div class="nav-flex" style="padding: 0 20px;">
            <a href="https://gupi24.vercel.app/index.html" class="brand">GUPI24</a>
            <nav class="nav-links">
                <a href="https://gupi24.vercel.app/index.html">Home</a>
                <a href="https://gupi24.vercel.app/news.html">News</a>
                <a href="https://gupi24.vercel.app/asia.html">Asia</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <main class="page-content">
            <h1>Hubungi Kami</h1>
            <p style="margin-bottom: 30px; color: #a0a0a0;">Punya pertanyaan tentang artikel kami atau ingin beriklan? Silakan isi formulir di bawah ini atau email langsung ke <strong>contact@gupi24.com</strong>.</p>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Nama Lengkap</label>
                    <input type="text" id="name" name="name" required placeholder="Masukkan nama Anda">
                </div>
                
                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" name="email" required placeholder="contoh@email.com">
                </div>
                
                <div class="form-group">
                    <label for="subject">Subjek</label>
                    <input type="text" id="subject" name="subject" placeholder="Perihal pesan">
                </div>
                
                <div class="form-group">
                    <label for="message">Pesan</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Tulis pesan Anda di sini..."></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Kirim Pesan</button>
            </form>
        </main>
    </div>

    <footer>
        <div class="container">
            <div class="footer-nav">
                <a href="https://gupi24.vercel.app/index.html">Home</a>
                <a href="https://gupi24.vercel.app/privacy-policy.html">Privacy Policy</a>
                <a href="https://gupi24.vercel.app/terms.html">Terms of Service</a>
                <!-- Link ke diri sendiri agar konsisten -->
                <a href="https://gupi24.vercel.app/contact.html" style="color:white;">Contact</a> 
            </div>
            <p style="margin-top: 20px; color: #444; font-size: 0.8rem;">&copy; 2024 GUPI24. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
